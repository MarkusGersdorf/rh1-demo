quarkus.application.name=accounts-api
quarkus.http.port=8080

# Dev-only JWT verification against a local key. The demo's point is the
# authorisation bug, not key management, so this stays deliberately plain.
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://accounts.demo.redhat.com

quarkus.log.level=INFO
quarkus.log.category."com.redhat.demo".level=DEBUG

quarkus.container-image.build=false
quarkus.container-image.group=demo
quarkus.container-image.name=accounts-api
