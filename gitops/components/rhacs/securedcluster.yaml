---
# Requires the init bundle secret in this namespace first. That secret is
# generated by Central and cannot be committed to git, so it is created by
# scripts/02-acs-init-bundle.sh. Argo CD will report this CR as degraded until
# the bundle exists - expected, not a failure.
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterName: lightwell-inward-demo
  centralEndpoint: "central.stackrox.svc:443"
  admissionControl:
    listenOnCreates: true
    listenOnUpdates: true
    listenOnEvents: true
    # The demo hinges on this: enforcement happens at admission, so the
    # rejection is visible in `oc apply` output on stage.
    bypass: BreakGlassAnnotation
    contactImageScanners: ScanIfMissing
    timeout: 20
  perNode:
    collector:
      collection: CORE_BPF
