---
# NO `spec.channel` ANYWHERE IN THIS FILE, DELIBERATELY.
#
# Omitting it makes OLM use the package's own defaultChannel from the catalog
# on *this* cluster. Hardcoding channels here was wrong twice over: the names
# differ per OCP version, and a channel that does not exist produces a
# Subscription stuck on ResolutionFailed, which Argo CD reported as Synced and
# which then silently starved every later sync wave of its CRDs.
#
# Concretely: this file previously pinned advanced-cluster-management to
# release-2.15, which is not offered on OCP 4.22 - that catalog carries
# release-2.16 and release-2.17.
#
# To pin deliberately, first ask the cluster what exists:
#
#   oc get packagemanifest <name> -n openshift-marketplace \
#     -o jsonpath='{.status.defaultChannel}{"  "}{range .status.channels[*]}{.name}{" "}{end}'
#
# then add `channel:` back for that one Subscription only, and expect to
# revisit it on the next OCP minor.

apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: open-cluster-management-og
  namespace: open-cluster-management
spec:
  targetNamespaces:
    - open-cluster-management
---
# RHACM - governance, policy, fleet
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: advanced-cluster-management
  namespace: open-cluster-management
spec:
  installPlanApproval: Automatic
  name: advanced-cluster-management
  source: redhat-operators
  sourceNamespace: openshift-marketplace
