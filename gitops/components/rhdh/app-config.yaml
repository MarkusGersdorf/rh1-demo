---
# CLUSTER_DOMAIN is a placeholder. Run scripts/01-set-cluster-domain.sh to
# replace it everywhere and commit the result - Argo CD then reconciles.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhdh-app-config
  namespace: rhdh
data:
  app-config.yaml: |
    app:
      title: Red Hat Developer Hub - Lightwell Inward
      baseUrl: https://rhdh-rhdh.apps.ocp.xv426.sandbox519.opentlc.com

    backend:
      baseUrl: https://rhdh-rhdh.apps.ocp.xv426.sandbox519.opentlc.com
      cors:
        origin: https://rhdh-rhdh.apps.ocp.xv426.sandbox519.opentlc.com
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: lightwell-inward
              secret: ${BACKEND_SECRET}
      database:
        client: better-sqlite3
        connection: ':memory:'

    auth:
      environment: development
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    integrations:
      # catalog.locations below is a raw.githubusercontent.com URL, which the
      # repo being private makes unreadable without this. GITHUB_TOKEN comes
      # from rhdh-secrets, written by scripts/02-signing-setup.sh.
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
      gitea:
        - host: gitea-gitea.apps.ocp.xv426.sandbox519.opentlc.com
          baseUrl: https://gitea-gitea.apps.ocp.xv426.sandbox519.opentlc.com
          username: ${GITEA_USERNAME}
          password: ${GITEA_PASSWORD}

    catalog:
      import:
        entityFilename: catalog-info.yaml
      rules:
        - allow: [Component, System, API, Resource, Location, Template]
      locations:
        - type: url
          target: https://raw.githubusercontent.com/MarkusGersdorf/rh1-demo/main/gitops/components/rhdh/catalog/all.yaml

    # Surfaces the scanner's verdicts on the component page. The scanner's
    # /api/reviews is plain JSON, so no custom plugin is needed for the demo.
    proxy:
      endpoints:
        '/lightwell-inward':
          target: http://ai-code-review.lightwell-inward.svc.cluster.local:8080
          changeOrigin: true

    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'local'
