---
# Stage A serving. Same llama.cpp runtime pattern as Stage B, but a 1B model at
# F16, so the resource footprint is a fraction of the 8B's.
#
# Antares' CLI talks to /v1/completions, not /v1/chat/completions - its model
# spec sets use_completions_api: true. llama-server serves both, so no special
# configuration is needed, but do not "fix" the CLI's endpoint to the chat API.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: antares-cpu-runtime
  namespace: lightwell-inward
  annotations:
    openshift.io/display-name: "llama.cpp - Antares (CPU, F16 GGUF)"
    # See servingruntime-llamacpp-cpu.yaml: the CRD does not exist at plan time.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    opendatahub.io/dashboard: "true"
spec:
  supportedModelFormats:
    - name: gguf-antares
      autoSelect: false
      priority: 1
  protocolVersions:
    - v2
  multiModel: false
  containers:
    - name: kserve-container
      image: ghcr.io/ggml-org/llama.cpp:server
      args:
        - --model
        - /mnt/models/antares-1b-f16.gguf
        - --alias
        - antares-1b
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        # Matches the upstream POC's launcher.
        - --ctx-size
        - "16384"
        - --parallel
        - "1"
        - --gpu-layers
        - "0"
        - --flash-attn
        - "off"
        # Must track the CPU limit below. llama.cpp pins a threadpool at
        # startup, so a higher limit does nothing on its own.
        - --threads
        - "8"
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        # CPU raised 4 -> 8. Expect roughly 1.3-1.6x, NOT 2x: generation
        # here is memory-bandwidth bound, not compute bound, so extra
        # threads contend for the same bus. Measured ~8 tok/s at 4 threads.
        #
        # Memory deliberately unchanged. The model is 3.5GB and already fits
        # in 8Gi - capacity is not the constraint and raising it buys
        # nothing. What costs time is streaming every weight from RAM for
        # each token generated.
        #
        # The real lever is quantisation: this model is F16 (3.5GB) while
        # the 8B Foundation-Sec model next to it is Q4_K_M (4.6GB). At
        # Q4_K_M, Antares would be ~0.9GB and roughly 4x faster. The fetch
        # script converts to F16 and stops; model-fetch goes on to run
        # llama-quantize. Adding that step is the fix this only mitigates.
        #
        # Node headroom checked before raising: 15.5 cores allocatable per
        # node against 7-10 requested.
        requests:
          cpu: "4"
          memory: 5Gi
        limits:
          cpu: "8"
          memory: 8Gi
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 120
        periodSeconds: 30
        failureThreshold: 10
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: antares
  namespace: lightwell-inward
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/autoscalerClass: external
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "7"
  labels:
    opendatahub.io/dashboard: "true"
    lightwell-inward.redhat.com/role: localizer
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: gguf-antares
      runtime: antares-cpu-runtime
      storageUri: pvc://antares-model/
