---
# Antares 1B: the Stage A localizer, plus the Antares CLI itself.
#
# The CLI is distributed *inside* the gated Hugging Face model repository, as
# assets/antares-cli.zip. That is unusual and it is the main integration
# friction: getting the CLI requires an HF token for an account that has
# accepted the model licence. Doing it here, in a job that already needs the
# token and a PVC, keeps that credential out of the scanner's image build.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: antares-cli
  namespace: lightwell-inward
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  accessModes:
    # ReadWriteMany on CephFS, not ReadWriteOnce on RBD. This volume is
    # mounted by more than one pod at once and RWO cannot do that - it binds
    # to a single NODE, so the second pod gets
    #
    #   Multi-Attach error for volume "pvc-...": Volume is already used by
    #   pod(s) ...
    #
    # and sits Pending until something is deleted. No amount of ordering or
    # job lifecycle management fixes that; the access mode is simply wrong
    # for the sharing this demo needs.
    - ReadWriteMany
  storageClassName: ocs-external-storagecluster-cephfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: antares-model
  namespace: lightwell-inward
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  accessModes:
    # RWX on CephFS - see antares-fetch-job.yaml for why. Shared between the
    # fetch Job and the predictor that serves from it.
    - ReadWriteMany
  storageClassName: ocs-external-storagecluster-cephfs
  resources:
    requests:
      # 1B at F16 is ~2.5GB plus the source weights during conversion. A long
      # way from the 80Gi the 8B model needed.
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: antares-fetch-script
  namespace: lightwell-inward
data:
  fetch.sh: |
    #!/usr/bin/env bash
    # Populate the Antares model PVC with an F16 GGUF, and the CLI PVC with the
    # CLI in its own virtualenv. Idempotent on both halves.
    set -euo pipefail

    MODEL_REPO="${MODEL_REPO:-fdtn-ai/antares-1b}"
    MODEL_REVISION="${MODEL_REVISION:-}"
    # CPU inference needs F16. The upstream README builds BF16 for Metal; on a
    # CPU-only cluster that is the wrong precision, so convert to F16 here.
    TARGET="/mnt/models/antares-1b-f16.gguf"
    SNAPSHOT="/mnt/models/hf-snapshot"
    CLI_ROOT="/mnt/cli"

    have_model() { [[ -s "${TARGET}" ]]; }
    have_cli()   { [[ -x "${CLI_ROOT}/venv/bin/antares" ]]; }

    if have_model && have_cli; then
      echo "[fetch] model and CLI already present - nothing to do."
      exit 0
    fi

    command -v hf >/dev/null 2>&1 || pip install --quiet --no-cache-dir "huggingface_hub[cli]"

    if [[ -z "${HF_TOKEN:-}" ]]; then
      echo "[fetch] ERROR: HF_TOKEN is empty."
      echo "[fetch] Antares is gated. Both the weights AND the CLI live behind the"
      echo "[fetch] licence click-through, so there is no token-free path here."
      echo "[fetch]   oc create secret generic huggingface-token -n lightwell-inward \\"
      echo "[fetch]     --from-literal=token=hf_..."
      exit 1
    fi

    if [[ ! -d "${SNAPSHOT}" ]]; then
      echo "[fetch] downloading ${MODEL_REPO}"
      if [[ -n "${MODEL_REVISION}" ]]; then
        hf download "${MODEL_REPO}" --revision "${MODEL_REVISION}" --local-dir "${SNAPSHOT}"
      else
        hf download "${MODEL_REPO}" --local-dir "${SNAPSHOT}"
      fi
    fi

    if ! have_cli; then
      echo "[fetch] extracting the Antares CLI from the model download"
      ZIP="$(find "${SNAPSHOT}" -name 'antares-cli*.zip' | head -1)"
      [[ -n "${ZIP}" ]] || { echo "[fetch] ERROR: no antares-cli zip in the snapshot"; exit 1; }

      mkdir -p "${CLI_ROOT}/pkg"
      python3 -m zipfile -e "${ZIP}" "${CLI_ROOT}/pkg"

      # --copies, and an EXPLICIT python3.12. Without both, this job builds a
      # virtualenv that cannot import its own package:
      #
      #   - a default venv symlinks bin/python3 to /usr/bin/python3, which in
      #     these images is 3.9, while site-packages is lib/python3.12. The
      #     interpreter and the libraries then disagree and every import
      #     fails. --copies puts a real binary in bin/ instead.
      #   - the previous `python3 -m venv ... || --without-pip` fallback
      #     silently produced a pip-less venv whenever the first form failed
      #     for any reason, and the get-pip rescue below it needs egress.
      PY="$(command -v python3.12 || command -v python3)"
      echo "[fetch] building the CLI venv with ${PY} ($("${PY}" -V 2>&1))"
      rm -rf "${CLI_ROOT}/venv"
      "${PY}" -m venv --copies "${CLI_ROOT}/venv"

      # The gated zip contains a SOURCE TREE (pyproject.toml, src/), not a
      # wheel, so the old `install .../pkg/*.whl` matched nothing. It failed
      # into a fallback whose errors were discarded, which is how this job
      # reported success having installed the dependencies and not the
      # package.
      "${CLI_ROOT}/venv/bin/pip" install --quiet --no-cache-dir "${CLI_ROOT}/pkg"

      # Assert it actually works. Stage A is advisory, so a broken CLI is
      # invisible at pipeline time - antares-localize prints one line and
      # passes. Fail HERE, where the cause is, rather than leaving a demo
      # that quietly has no localizer.
      "${CLI_ROOT}/venv/bin/python3" -c 'import antares_cli' \
        || { echo "[fetch] ERROR: antares_cli is not importable after install"; exit 1; }
      "${CLI_ROOT}/venv/bin/antares" --version \
        || { echo "[fetch] ERROR: the antares entrypoint does not run"; exit 1; }

      # The shebang is absolute, so every consumer must mount this PVC at
      # CLI_ROOT. The antares-localize task sets mountPath to match; keep
      # them in step.
      echo "[fetch] CLI installed at ${CLI_ROOT}/venv/bin/antares"
      echo "[fetch] shebang: $(head -1 "${CLI_ROOT}/venv/bin/antares")"
    fi

    if ! have_model; then
      CONVERT="$(find / -maxdepth 4 -name 'convert_hf_to_gguf.py' -type f 2>/dev/null | head -1 || true)"
      [[ -n "${CONVERT}" ]] || { echo "[fetch] ERROR: convert_hf_to_gguf.py not found - use the ':full' llama.cpp image"; exit 1; }
      echo "[fetch] converting to F16 GGUF (required for CPU inference)"
      python3 "${CONVERT}" "${SNAPSHOT}" --outfile "${TARGET}.part" --outtype f16
      mv "${TARGET}.part" "${TARGET}"
      sha256sum "${TARGET}" | tee /mnt/models/antares.sha256
      # Copy onto the CLI PVC too, so the pipeline can pin the model in the
      # attestation without mounting the model volume.
      cut -d' ' -f1 /mnt/models/antares.sha256 > "${CLI_ROOT}/antares.sha256"
    fi

    # The snapshot is only needed for conversion and the CLI extraction.
    rm -rf "${SNAPSHOT}"
    echo "[fetch] done: $(du -h "${TARGET}" | cut -f1)"
