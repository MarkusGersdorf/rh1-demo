---
# Red Hat Trusted Artifact Signer - the Sigstore stack: Fulcio (certificates),
# Rekor (transparency log), CTlog, TUF (trust root). No TSA; see below.
#
# This is v1alpha1 deliberately. v1 is the storage version on RHTAS 1.5, but
# it renames externalAccess to ingress on every component, so moving is a
# rewrite rather than a version bump. v1alpha1 is still served.
#
# The demo signs with a cosign key but still uploads to this Rekor, so the
# signature and the AI-review attestation are both in a real transparency log.
# That is what makes "revoke by model digest" more than a slide.
apiVersion: rhtas.redhat.com/v1alpha1
kind: Securesign
metadata:
  name: securesign
  namespace: trusted-artifact-signer
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  rekor:
    externalAccess:
      enabled: true
    rekorSearchUI:
      enabled: true
    monitoring:
      enabled: false
  fulcio:
    externalAccess:
      enabled: true
    config:
      OIDCIssuers:
        # The cluster's own service-account issuer. Enough for keyless signing
        # from in-cluster workloads if you choose to switch sign-and-attest
        # over to keyless.
        - Issuer: https://kubernetes.default.svc
          IssuerURL: https://kubernetes.default.svc
          ClientID: trusted-artifact-signer
          Type: kubernetes
    certificate:
      organizationName: Red Hat Demo
      organizationEmail: lightwell-inward@redhat.com
      commonName: fulcio.lightwell-inward.demo
    monitoring:
      enabled: false
  ctlog:
    monitoring:
      enabled: false
  # Spelled out even though every value here is the schema default. The CRD
  # converts v1alpha1 to the v1 storage version through a webhook, and on
  # RHTAS 1.5 that webhook emits nulls for these two when the block is absent
  # - defaults are applied after conversion, not before. The apply then fails
  # with "spec.trillian.database.create ... must be of type boolean: null",
  # which reads like a manifest error and is not one.
  trillian:
    database:
      create: true
      pvc:
        retain: true
        size: 5Gi
  tuf:
    externalAccess:
      enabled: true
  # A TSA, even though the demo never passes --timestamp-server-url.
  #
  # This block used to be absent on the reasoning that a timestamp authority
  # buys the demo nothing. That was true for cosign v2 and is wrong now: TUF
  # autodiscovers a TimestampAuthority to assemble tsa.certchain.pem, finds
  # none, and parks forever on
  #
  #   tsa.certchain.pem=False  failed to autodiscovery service:
  #                            no *v1.TimestampAuthorityList found
  #
  # which leaves Securesign at Ready=False and publishes no TUF URL. cosign
  # v3 needs that TUF root to verify Rekor inclusion proofs - without it,
  # signing dies on "not enough verified log entries from transparency log:
  # 0 < 1". So omitting the TSA to avoid one hang caused a worse one.
  #
  # The old warning still holds and is why the chain is spelled out: once the
  # block exists, tsa.signer.certificateChain is required, and the CRD
  # rejects a partial chain with "rootCA/leafCA/intermediateCA are all
  # required when certificateChainRef is not provided". Giving all three an
  # organizationName lets the operator self-provision the certificates, so
  # nothing points at a secret nobody creates.
  #
  # The field is `tsa`. It is not `timestampAuthority` - that name is in no
  # served version of this CRD, and server-side apply rejects it with
  # ".spec.timestampAuthority: field not declared in schema", failing the
  # whole Application rather than just the field. Equally, `externalAccess`
  # below is the v1alpha1 spelling; v1 calls it `ingress`. Verified against
  # the CRD, not guessed:
  #
  #   oc get crd securesigns.rhtas.redhat.com -o json | jq '
  #     .spec.versions[] | {(.name): (.schema.openAPIV3Schema.properties
  #     .spec.properties.tsa.properties | keys)}'
  tsa:
    externalAccess:
      enabled: true
    signer:
      type: file
      certificateChain:
        rootCA:
          organizationName: Red Hat Demo
          organizationEmail: lightwell-inward@redhat.com
          commonName: tsa-root.lightwell-inward.demo
        intermediateCA:
          - organizationName: Red Hat Demo
            organizationEmail: lightwell-inward@redhat.com
            commonName: tsa-intermediate.lightwell-inward.demo
        leafCA:
          organizationName: Red Hat Demo
          organizationEmail: lightwell-inward@redhat.com
          commonName: tsa.lightwell-inward.demo
