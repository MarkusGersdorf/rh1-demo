---
# Stand-in for the Lightwell Network catalog.
#
# Lightwell Network ships "a continuous stream of digitally signed binaries,
# source code, and comprehensive compliance artifacts, including complete
# SBOMs, delivered directly into existing pipelines." Its consumption API is
# not publicly documented, so the lightwell-verify task reads this ConfigMap
# instead. The check it performs is the real shape; swapping this for an API
# client is the one change a genuine integration needs.
#
# SECOND ACT, optional: flip any entry's status to "vulnerable" and give it a
# note, and the pipeline fails at the dependency stage instead - showing that
# the Lightwell half of the gate has teeth too. Good answer to "what if the
# problem is in a library?"
apiVersion: v1
kind: ConfigMap
metadata:
  name: lightwell-catalog
  namespace: lightwell-inward
data:
  catalog.json: |
    {
      "catalogVersion": "2026.10-lightwell-network",
