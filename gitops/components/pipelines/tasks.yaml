---
# Tasks are defined inline rather than pulled from the Tekton Hub or relying on
# specific ClusterTask versions being present. More YAML, far fewer surprises
# the morning of the event.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-source
  namespace: lightwell-inward
spec:
  description: Clone the repo and record the revision range under review.
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
    - name: base-revision
      type: string
      default: ""
      description: Commit to diff against. Defaults to the parent of revision.
  workspaces:
    - name: source
  results:
    - name: commit
      type: string
      description: Resolved SHA of the reviewed commit.
    - name: base-commit
      type: string
      description: Resolved SHA of the comparison base.
  steps:
    - name: clone
      image: registry.access.redhat.com/ubi9/toolbox:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        rm -rf repo && mkdir -p repo

        # Full history: the review needs the parent commit to produce a diff.
        git clone --no-single-branch "$(params.url)" repo
        cd repo
        git checkout "$(params.revision)"

        # Later tasks run in different pods with different UIDs under
        # restricted-v2 SCC. Write a gitconfig into the shared workspace so
        # every subsequent step that sets GIT_CONFIG_GLOBAL can use git.
        printf '[safe]\n\tdirectory = *\n' > "$(workspaces.source.path)/.gitconfig"

        COMMIT="$(git rev-parse HEAD)"
        BASE="$(params.base-revision)"
        if [[ -z "${BASE}" ]]; then
          BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
        else
          BASE="$(git rev-parse "${BASE}")"
        fi

        echo "reviewing ${BASE:0:12}..${COMMIT:0:12}"
        printf '%s' "${COMMIT}" > "$(results.commit.path)"
        printf '%s' "${BASE}"   > "$(results.base-commit.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lightwell-verify
  namespace: lightwell-inward
spec:
  description: >
    Verify every declared dependency against the Lightwell Network catalog of
    remediated, signed artifacts.

    IMPLEMENTATION NOTE, and say this plainly if asked on stage: Lightwell
    Network's consumption API is not publicly documented, so this task reads a
    local ConfigMap standing in for the catalog. The shape of the check is
    right - resolve each dependency, confirm it is a remediated version, and
    confirm the signature verifies - and the ConfigMap is the one piece a real
    integration would replace with an API client.
  params:
    - name: catalog-path
      type: string
      default: /lightwell/catalog.json
  workspaces:
    - name: source
  results:
    - name: verdict
      type: string
    - name: summary
      type: string
  steps:
    - name: verify
      image: registry.access.redhat.com/ubi9/python-312:latest
      workingDir: $(workspaces.source.path)/repo
      volumeMounts:
        - name: lightwell-catalog
          mountPath: /lightwell
      script: |
        #!/usr/bin/env python3
        import json, re, sys, pathlib

        catalog = json.load(open("$(params.catalog-path)"))
        entries = {e["coordinate"]: e for e in catalog["dependencies"]}

        pom = pathlib.Path("pom.xml")
        if not pom.exists():
            print("no pom.xml - nothing to verify")
            pathlib.Path("$(results.verdict.path)").write_text("skipped")
            pathlib.Path("$(results.summary.path)").write_text("no manifest found")
            sys.exit(0)

        text = pom.read_text()
        deps = re.findall(
            r"<groupId>([^<]+)</groupId>\s*<artifactId>([^<]+)</artifactId>", text)

        # The first match is the project's own coordinates, not a dependency.
        # Reporting your own artifact as "outside Lightwell coverage" is true
        # but confusing, so drop it.
        self_coord = f"{deps[0][0]}:{deps[0][1]}" if deps else ""

        print(f"Lightwell Network catalog: {catalog['catalogVersion']} "
              f"({len(entries)} remediated artifacts)\n")

        unknown, remediated, flagged = [], [], []
        for group, artifact in deps:
            coord = f"{group}:{artifact}"
            if "${" in coord or coord == self_coord:
                continue  # Maven property, or the project itself
            entry = entries.get(coord)
            if entry is None:
                unknown.append(coord)
                print(f"  ?  {coord}  not in catalog (outside Lightwell coverage)")
            elif entry["status"] == "remediated":
                remediated.append(coord)
                print(f"  OK {coord}  {entry['version']}  "
                      f"signed by {entry['signedBy']}  "
                      f"rekor={entry['rekorLogIndex']}")
            else:
                flagged.append((coord, entry))
                print(f"  !! {coord}  {entry['status']}: {entry.get('note', '')}")

        print(f"\n{len(remediated)} remediated, {len(unknown)} uncovered, "
              f"{len(flagged)} flagged")

        summary = (f"{len(remediated)} remediated / {len(unknown)} uncovered "
                   f"/ {len(flagged)} flagged")
        pathlib.Path("$(results.summary.path)").write_text(summary)

        if flagged:
            print("\nFAIL: a dependency is flagged by Lightwell and must be "
                  "upgraded before this artifact can be built.")
            pathlib.Path("$(results.verdict.path)").write_text("fail")
            sys.exit(1)

        print("\nPASS: dependency supply chain clean.")
        print("This is the half Lightwell already covers. The next task is the "
              "half it does not.")
        pathlib.Path("$(results.verdict.path)").write_text("pass")
  volumes:
    - name: lightwell-catalog
      configMap:
        name: lightwell-catalog
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sast-semgrep
  namespace: lightwell-inward
spec:
  description: >
    Deterministic SAST. In this demo it passes clean on the planted flaw, which
    is the entire point - do not treat that as Semgrep failing. There is no
    taint flow and no dangerous sink; pattern matching has nothing to match.
  workspaces:
    - name: source
  results:
    - name: verdict
      type: string
    - name: findings-count
      type: string
  steps:
    - name: semgrep
      image: docker.io/semgrep/semgrep:latest
      workingDir: $(workspaces.source.path)/repo
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        # --error would make a finding fail the step; we want the count so the
        # pipeline can report "SAST clean" alongside the AI result.
        semgrep scan --config=p/java --config=p/secrets --config=p/owasp-top-ten \
          --json --output=/tmp/semgrep.json --quiet --metrics=off
        RC=$?

        COUNT=$(python3 -c "import json;print(len(json.load(open('/tmp/semgrep.json'))['results']))" 2>/dev/null || echo 0)
        echo "semgrep findings: ${COUNT}"
        python3 -c "
        import json
        for r in json.load(open('/tmp/semgrep.json'))['results']:
            print(f\"  {r['extra']['severity']:8} {r['check_id']}\")
            print(f\"           {r['path']}:{r['start']['line']}\")
        " 2>/dev/null || true

        printf '%s' "${COUNT}" > "$(results.findings-count.path)"
        if [[ "${COUNT}" -gt 0 ]]; then
          printf 'findings' > "$(results.verdict.path)"
        else
          printf 'pass' > "$(results.verdict.path)"
          echo
          echo "SAST is clean. That is not the same as secure."
        fi
        exit 0
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: antares-localize
  namespace: lightwell-inward
spec:
  description: >
    Stage A. Cisco's Antares CLI, served by RHOAI, localizing likely
    vulnerability classes to files.

    Antares is a file-level localizer - it reports which file probably holds
    which CWE, with no line number, no rationale and no remediation. That is
    its documented purpose, not a limitation of this integration. It is cheap
    enough to run on every commit, which is why it runs first and why the
    reasoning model that follows only has to explain, not search.

    This task never fails the pipeline. A localizer's silence is weak evidence
    - it examines a ranked subset of roughly 944 CWE classes - so it informs
    Stage B rather than gating it.
  params:
    - name: endpoint
      type: string
      default: http://antares-predictor.lightwell-inward.svc.cluster.local:8080/v1/completions
    - name: model
      type: string
      default: antares-1b
    - name: max-cwes
      type: string
      default: "5"
  workspaces:
    - name: source
    - name: antares-cli
      description: PVC holding the Antares CLI extracted by the antares-fetch job.
  results:
    - name: findings-count
      type: string
    - name: files-flagged
      type: string
  steps:
    - name: sweep
      image: registry.access.redhat.com/ubi9/python-312:latest
      workingDir: $(workspaces.source.path)/repo
      timeout: 25m0s
      env:
        - name: ANTARES_ENDPOINT
          value: $(params.endpoint)
        - name: ANTARES_MODEL
          value: $(params.model)
        - name: ANTARES_DATA_DIR
          value: /tmp/antares-data
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        OUT="$(workspaces.source.path)/antares-report"
        rm -rf "${OUT}"
        mkdir -p /tmp/antares-data

        CLI="$(workspaces.antares-cli.path)/venv/bin/antares"
        if [[ ! -x "${CLI}" ]]; then
          echo "Antares CLI not found at ${CLI}."
          echo "The CLI ships inside the gated Hugging Face model download, so the"
          echo "antares-fetch job extracts it onto this PVC. Check that job."
          echo "Stage A is advisory - continuing without it."
          exit 0
        fi

        echo "== Antares sweep (file-level localization)"
        "${CLI}" sweep . --max-cwes "$(params.max-cwes)" --workers 1 \
          --no-tui --output "${OUT}" \
          || echo "antares exited non-zero - continuing, Stage A is advisory"
        exit 0
    - name: summarize
      image: registry.access.redhat.com/ubi9/python-312:latest
      script: |
        #!/usr/bin/env python3
        """Print Stage A's result and publish its shape as task results."""
        import json
        import pathlib

        report = pathlib.Path("$(workspaces.source.path)/antares-report/report.json")
        count = pathlib.Path("$(results.findings-count.path)")
        flagged = pathlib.Path("$(results.files-flagged.path)")

        if not report.is_file():
            print("no Antares report - Stage A did not run")
            count.write_text("0")
            flagged.write_text("")
            raise SystemExit(0)

        data = json.loads(report.read_text())
        findings = data.get("findings") or []
        summary = data.get("summary") or {}
        meta = data.get("metadata") or {}

        print(f"model    : {meta.get('model')}")
        print(f"mode     : {meta.get('mode')}")
        print(f"duration : {summary.get('duration_seconds', 0):.1f}s "
              f"({summary.get('tool_call_count', 0)} tool calls, "
              f"{summary.get('failed_tool_calls', 0)} failed)")
        print(f"checked  : {len(meta.get('cwe_ids') or [])} CWE classes")
        print()

        for f in findings:
            cwes = ",".join(f.get("cwe_ids") or [])
            print(f"  {f.get('file_path')}  {cwes}  "
                  f"likelihood={f.get('likelihood_of_exploit')}  {f.get('title')}")

        if not findings:
            print("  no files flagged")
            print()
            print("Silence here is weak evidence: Antares examined a ranked subset")
            print("of the CWE catalogue. Stage B still reviews the whole diff.")

        files = sorted({f.get("file_path", "") for f in findings if f.get("file_path")})
        count.write_text(str(len(findings)))
        flagged.write_text(",".join(files))

        # Carry the served model's digest alongside the report so the
        # attestation can pin Stage A. Without it the predicate records
        # "unpinned" and Enterprise Contract rejects the build.
        src = pathlib.Path("$(workspaces.antares-cli.path)/antares.sha256")
        if src.is_file():
            dest = report.parent / "model.sha256"
            dest.write_text(src.read_text().strip())
            print(f"\nStage A model digest: {src.read_text().strip()[:16]}...")
        else:
            print("\nWARNING: no antares.sha256 on the CLI volume - Stage A will")
            print("be recorded as unpinned and Enterprise Contract will deny it.")
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-code-review
  namespace: lightwell-inward
spec:
  description: >
    The extension point. Sends the diff to the Foundation-Sec reasoning model
    via the scanner service and fails the pipeline on a blocking finding.
    Writes the in-toto predicate to the workspace for the signing task.
  params:
    - name: scanner-url
      type: string
      default: http://ai-code-review.lightwell-inward.svc.cluster.local:8080
    - name: commit
      type: string
    - name: base-commit
      type: string
    - name: repo-url
      type: string
    - name: semgrep-verdict
      type: string
      default: unknown
  workspaces:
    - name: source
  results:
    - name: verdict
      type: string
    - name: findings-count
      type: string
    - name: top-severity
      type: string
  steps:
    - name: review
      image: registry.access.redhat.com/ubi9/python-312:latest
      workingDir: $(workspaces.source.path)/repo
      # Generous: CPU inference on an 8B reasoning model is minutes, not seconds.
      timeout: 20m0s
      env:
        - name: GIT_CONFIG_GLOBAL
          value: $(workspaces.source.path)/.gitconfig
      script: |
        #!/usr/bin/env python3
        """Collect the diff, ask the model, enforce the verdict."""
        import json, pathlib, subprocess, sys, urllib.error, urllib.request

        COMMIT   = "$(params.commit)"
        BASE     = "$(params.base-commit)"
        REPO     = "$(params.repo-url)"
        SCANNER  = "$(params.scanner-url)".rstrip("/")

        def git(*args):
            return subprocess.run(["git", *args], capture_output=True,
                                  text=True, check=True).stdout

        def _antares_digest():
            path = pathlib.Path(
                "$(workspaces.source.path)/antares-report/model.sha256")
            try:
                return "sha256:" + path.read_text().strip().split()[0]
            except (OSError, IndexError):
                return None

        def _localizer_payload(data):
            """Shape the Antares report for the scanner's /review API."""
            meta = data.get("metadata") or {}
            summary = data.get("summary") or {}
            selection = meta.get("selection") or {}
            backend = ((meta.get("model_configuration") or {}).get("backend")) or {}
            repro = meta.get("reproducibility") or {}
            temperature = backend.get("temperature")
            return {
                "tool": "antares-cli",
                "model": meta.get("model", "unknown"),
                "mode": meta.get("mode", "unknown"),
                "findings": [
                    {
                        "title": f.get("title", ""),
                        "file": f.get("file_path", ""),
                        "cwe": (f.get("cwe_ids") or [""])[0],
                        "cwes": f.get("cwe_ids") or [],
                        "likelihood": str(f.get("likelihood_of_exploit", "unknown")).lower(),
                        "rank": int(f.get("submission_rank", 0) or 0),
                    }
                    for f in data.get("findings") or []
                ],
                "cwes_checked": meta.get("cwe_ids") or selection.get("selected_cwe_ids") or [],
                "cwes_available": int(selection.get("candidate_cwe_count", 0) or 0),
                "truncated": bool(selection.get("truncated", False)),
                "duration_seconds": float(summary.get("duration_seconds", 0.0) or 0.0),
                "tool_calls": int(summary.get("tool_call_count", 0) or 0),
                "failed_tool_calls": int(summary.get("failed_tool_calls", 0) or 0),
                "incomplete_reason": summary.get("incomplete_reason"),
                "request_hash": repro.get("request_hash"),
                "model_digest": _antares_digest(),
                "decoding": {
                    "temperature": temperature,
                    "topP": backend.get("top_p"),
                    "maxTokens": backend.get("max_tokens"),
                    "contextWindow": backend.get("context_window"),
                    "deterministic": temperature == 0
                        and not repro.get("remote_provider_may_vary", False),
                    "providerMayVary": bool(repro.get("remote_provider_may_vary", False)),
                },
            }

        diff = git("diff", f"{BASE}..{COMMIT}", "--", ".")
        if not diff.strip():
            print("empty diff - nothing to review")
            pathlib.Path("$(results.verdict.path)").write_text("pass")
            pathlib.Path("$(results.findings-count.path)").write_text("0")
            pathlib.Path("$(results.top-severity.path)").write_text("none")
            sys.exit(0)

        changed = [p for p in git("diff", "--name-only", f"{BASE}..{COMMIT}").split()
                   if p.endswith((".java", ".py", ".go", ".ts", ".js"))]

        # Whole files for changed sources, not just hunks. An authorisation bug
        # is often only visible when you can see the check's result go nowhere.
        files = []
        for path in changed[:10]:
            try:
                content = pathlib.Path(path).read_text()
            except OSError:
                continue
            if len(content) < 60_000:
                files.append({"path": path, "content": content})

        # Stage A's report, if it ran. Sent as a prior, not a filter: the
        # reasoner reviews the whole diff either way.
        localizer = None
        report = pathlib.Path("$(workspaces.source.path)/antares-report/report.json")
        if report.is_file():
            try:
                localizer = _localizer_payload(json.loads(report.read_text()))
                print(f"Stage A: {len(localizer['findings'])} file(s) flagged by "
                      f"{localizer['model']}")
            except (json.JSONDecodeError, KeyError, TypeError) as exc:
                print(f"Stage A report unreadable ({exc}) - proceeding without it")
        else:
            print("Stage A: no Antares report - proceeding on the diff alone")

        payload = {
            "repository": REPO, "commit": COMMIT, "base_commit": BASE,
            "diff": diff, "files": files,
            "complementary": [{
                "name": "semgrep",
                "verdict": "$(params.semgrep-verdict)",
                "note": "Ran in the same pipeline. Covers a different bug class.",
            }],
        }
        if localizer is not None:
            payload["localizer"] = localizer

        print(f"reviewing {BASE[:12]}..{COMMIT[:12]}")
        print(f"  {len(diff.splitlines())} diff lines, {len(files)} full files\n")

        req = urllib.request.Request(
            f"{SCANNER}/review",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
        )
        try:
            with urllib.request.urlopen(req, timeout=900) as resp:
                result = json.load(resp)
        except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError) as exc:
            # Fail closed. A gate that opens when the model is down is decoration.
            print(f"FAIL: scanner unreachable: {exc}")
            pathlib.Path("$(results.verdict.path)").write_text("error")
            pathlib.Path("$(results.findings-count.path)").write_text("0")
            pathlib.Path("$(results.top-severity.path)").write_text("unknown")
            sys.exit(1)

        verdict  = result["verdict"]
        findings = result.get("findings", [])
        tag = "REPLAY" if result.get("replayed") else "LIVE"

        print("=" * 78)
        print(f"  {result['model']}   [{tag}]")
        print(f"  backend={result['backend']}  prompt={result['prompt_version']}"
              f"  {result['latency_ms']} ms")
        print("=" * 78)
        if result.get("summary"):
            print(f"\n{result['summary']}\n")

        for f in findings:
            print("-" * 78)
            corr = "  [corroborated by Stage A]" if f.get("corroborated_by_localizer") else ""
            print(f"  {f['severity'].upper()}  [{f['confidence']} confidence]  {f['title']}{corr}")
            print(f"  {f['cwe']}  {f['owasp']}")
            if f.get("cvss_vector"):
                print(f"  CVSS {f.get('cvss_score', '?')}  {f['cvss_vector']}")
            print(f"  {f['file']}:{f['line']}")
            print(f"\n  WHY\n    {f['rationale']}")
            if f.get("exploit"):
                print(f"\n  EXPLOIT\n    {f['exploit']}")
            if f.get("fix"):
                print(f"\n  FIX\n    {f['fix']}")
            print()
        print("-" * 78)

        if result.get("error"):
            print(f"\nscanner error: {result['error']}")

        # Hand the predicate to the signing task.
        if result.get("predicate"):
            out = pathlib.Path("$(workspaces.source.path)/ai-review-predicate.json")
            out.write_text(json.dumps(result["predicate"], indent=2))
            print(f"\npredicate written to {out}")

        top = findings[0]["severity"] if findings else "none"
        pathlib.Path("$(results.verdict.path)").write_text(verdict)
        pathlib.Path("$(results.findings-count.path)").write_text(str(len(findings)))
        pathlib.Path("$(results.top-severity.path)").write_text(top)

        if verdict in ("fail", "error"):
            print(f"\nVERDICT: {verdict.upper()} - no artifact will be built.")
            print("Lightwell's lesson applied inward: an unverifiable claim is "
                  "not a claim. This change does not get signed.")
            sys.exit(1)

        print("\nVERDICT: PASS - proceeding to build and sign.")
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
  namespace: lightwell-inward
spec:
  description: Build the container image with Buildah and push by digest.
  params:
    - name: image
      type: string
    - name: containerfile
      type: string
      default: ./Containerfile
  workspaces:
    - name: source
  results:
    - name: digest
      type: string
    - name: image-ref
      type: string
  steps:
    - name: buildah
      image: registry.redhat.io/rhel9/buildah:latest
      workingDir: $(workspaces.source.path)/repo
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        IMAGE="$(params.image)"

        buildah --storage-driver=vfs bud \
          --format=oci --tls-verify=false --no-cache \
          -f "$(params.containerfile)" -t "${IMAGE}" .

        buildah --storage-driver=vfs push --tls-verify=false \
          --digestfile=/tmp/digest "${IMAGE}"

        DIGEST="$(cat /tmp/digest)"
        echo "pushed ${IMAGE}@${DIGEST}"
        printf '%s' "${DIGEST}"                > "$(results.digest.path)"
        printf '%s@%s' "${IMAGE}" "${DIGEST}"  > "$(results.image-ref.path)"
      volumeMounts:
        - name: varlibcontainers
          mountPath: /var/lib/containers
  volumes:
    - name: varlibcontainers
      emptyDir: {}
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sign-and-attest
  namespace: lightwell-inward
spec:
  description: >
    Red Hat Trusted Artifact Signer. Signs the image, then attaches the AI
    review verdict as an in-toto attestation. Both land in the RHTAS Rekor
    transparency log, which is what makes the claim auditable and revocable.

    This task uses a cosign key from a Secret. Keyless (Fulcio + workload
    identity) is the production path and the flags are in the comments below;
    key-based is used here because a demo should not hinge on OIDC trust
    configuration at 09:00 on stage.
  params:
    - name: image-ref
      type: string
      description: Full image@sha256:... reference.
    - name: rekor-url
      type: string
      default: http://rekor-server.trusted-artifact-signer.svc.cluster.local
  workspaces:
    - name: source
  results:
    - name: rekor-log-index
      type: string
  steps:
    - name: sign
      image: registry.redhat.io/rhtas/cosign-rhel9:latest
      workingDir: $(workspaces.source.path)
      env:
        - name: COSIGN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cosign-keypair
              key: password
        - name: COSIGN_YES
          value: "true"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        IMAGE="$(params.image-ref)"
        REKOR="$(params.rekor-url)"

        echo "== signing ${IMAGE}"
        cosign sign --key k8s://lightwell-inward/cosign-keypair \
          --rekor-url="${REKOR}" \
          --allow-insecure-registry --tlog-upload=true \
          "${IMAGE}"

        # Keyless equivalent, for the production story:
        #   cosign sign --rekor-url="${REKOR}" \
        #     --fulcio-url=http://fulcio-server.trusted-artifact-signer.svc \
        #     --oidc-issuer="${OIDC_ISSUER}" --identity-token="${SA_TOKEN}" \
        #     "${IMAGE}"

        if [[ ! -f ai-review-predicate.json ]]; then
          echo "FAIL: no AI review predicate on the workspace."
          echo "The image will not be attested, so it cannot pass admission."
          exit 1
        fi

        echo
        echo "== attaching AI code review attestation"
        cat ai-review-predicate.json

        cosign attest --key k8s://lightwell-inward/cosign-keypair \
          --rekor-url="${REKOR}" \
          --type "https://redhat.com/lightwell-inward/code-review/v1" \
          --predicate ai-review-predicate.json \
          --allow-insecure-registry --tlog-upload=true \
          "${IMAGE}"

        echo
        echo "== verifying what we just produced"
        cosign verify --key k8s://lightwell-inward/cosign-keypair \
          --rekor-url="${REKOR}" --allow-insecure-registry \
          --insecure-ignore-tlog=false "${IMAGE}"

        cosign verify-attestation --key k8s://lightwell-inward/cosign-keypair \
          --rekor-url="${REKOR}" --allow-insecure-registry \
          --type "https://redhat.com/lightwell-inward/code-review/v1" \
          "${IMAGE}" > /tmp/att.json

        echo
        echo "Signature and attestation are in Rekor. The verdict is now a"
        echo "supply-chain fact, not a line in a CI log."

        python3 -c "
        import json,sys
        try:
            idx = json.load(open('/tmp/att.json')).get('logIndex','unknown')
        except Exception:
            idx = 'unknown'
        print(idx, end='')
        " > "$(results.rekor-log-index.path)" 2>/dev/null || printf 'unknown' > "$(results.rekor-log-index.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: acs-image-check
  namespace: lightwell-inward
spec:
  description: >
    RHACS image scan. Covers the layer the AI review does not: known CVEs in
    the base image and packaged dependencies. Both halves, deliberately.
  params:
    - name: image-ref
      type: string
    - name: central-endpoint
      type: string
      default: central.stackrox.svc:443
  steps:
    - name: roxctl
      image: quay.io/stackrox-io/roxctl:latest
      env:
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: acs-api-token
              key: token
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        roxctl image check --insecure-skip-tls-verify \
          --endpoint "$(params.central-endpoint)" \
          --image "$(params.image-ref)" \
          --output table
        RC=$?

        if [[ ${RC} -ne 0 ]]; then
          echo "RHACS build-time policy failed."
          exit ${RC}
        fi
        echo "RHACS build-time policies passed."
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ec-validate
  namespace: lightwell-inward
spec:
  description: >
    Enterprise Contract (Conforma). RHACS enforces that an image is signed by
    a trusted signer; it does not read inside the attestation. Enterprise
    Contract does - it evaluates rego policy against the in-toto predicate.

    This is the component that turns "the attestation says verdict=pass" into
    an enforced release rule, and it is the right answer when someone asks how
    you stop a signed-but-failing artifact from being promoted.
  params:
    - name: image-ref
      type: string
    - name: rekor-url
      type: string
      default: http://rekor-server.trusted-artifact-signer.svc.cluster.local
  workspaces:
    - name: source
  steps:
    - name: validate
      image: registry.redhat.io/rhtas/ec-rhel9:latest
      workingDir: $(workspaces.source.path)
      env:
        - name: COSIGN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cosign-keypair
              key: password
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # The public key arrives as a mounted secret - no cluster API calls,
        # no RBAC, and no assumption that `oc` exists in this image.
        [[ -s /keys/cosign.pub ]] \
          || { echo "FAIL: cosign.pub not mounted from the cosign-keypair secret"; exit 1; }
        cp /keys/cosign.pub /tmp/cosign.pub

        cat > /tmp/policy.yaml <<'POLICY'
        ---
        # Minimal, readable, and the whole point: the predicate must exist and
        # must say pass. Everything else about the image can be perfect and
        # this still blocks.
        sources:
          - policy:
              - /policies
            config:
              include:
                - lightwell_inward
        POLICY

        mkdir -p /tmp/policies/lightwell_inward
        cat > /tmp/policies/lightwell_inward/review.rego <<'REGO'
        package lightwell_inward

        import rego.v1

        # An artifact must carry a Lightwell Inward code review attestation.
        deny contains result if {
            not code_review_attestation
            result := {
                "code": "lightwell_inward.attestation_missing",
                "msg": "no Lightwell Inward code review attestation on this image",
            }
        }

        # And that review must have passed.
        deny contains result if {
            some att in code_review_attestations
            att.predicate.verdict != "pass"
            result := {
                "code": "lightwell_inward.review_failed",
                "msg": sprintf("code review verdict is %q, not \"pass\"", [att.predicate.verdict]),
            }
        }

        # A review of nothing is not a review. Guards against an empty-diff
        # attestation being used to launder a change.
        deny contains result if {
            some att in code_review_attestations
            att.predicate.scope.filesReviewed == 0
            result := {
                "code": "lightwell_inward.empty_scope",
                "msg": "attestation covers zero files",
            }
        }

        # Every reviewer must be pinned. An unpinned claim cannot be revoked
        # later, which removes the main reason to attest it at all. The
        # predicate carries a list because two models with different jobs
        # produce the verdict, and either one may need revoking alone.
        deny contains result if {
            some att in code_review_attestations
            some reviewer in att.predicate.reviewers
            reviewer.modelDigest == "unpinned"
            result := {
                "code": "lightwell_inward.model_unpinned",
                "msg": sprintf("reviewer %q has an unpinned modelDigest - claim is not revocable", [reviewer.stage]),
            }
        }

        # A verdict must come from something that can actually explain a
        # finding. Antares localizes files and reports no line, rationale or
        # remediation; if it were the only reviewer, "pass" would mean nothing
        # more than "a localizer checked a few CWE classes and stayed quiet".
        deny contains result if {
            some att in code_review_attestations
            explainers := [r | some r in att.predicate.reviewers; r.providesExplanation == true]
            count(explainers) == 0
            result := {
                "code": "lightwell_inward.no_explaining_reviewer",
                "msg": "no reviewer provides explanations - a localizer alone cannot clear a change",
            }
        }

        code_review_attestations := [a |
            some a in input.attestations
            a.predicateType == "https://redhat.com/lightwell-inward/code-review/v1"
        ]

        code_review_attestation if count(code_review_attestations) > 0
        REGO

        echo "== Enterprise Contract validation of $(params.image-ref)"
        ec validate image \
          --image "$(params.image-ref)" \
          --public-key /tmp/cosign.pub \
          --rekor-url "$(params.rekor-url)" \
          --policy /tmp/policy.yaml \
          --ignore-rekor=false \
          --output text \
          --strict
      volumeMounts:
        - name: cosign-pub
          mountPath: /keys
  volumes:
    - name: cosign-pub
      secret:
        secretName: cosign-keypair
        items:
          - key: cosign.pub
            path: cosign.pub
