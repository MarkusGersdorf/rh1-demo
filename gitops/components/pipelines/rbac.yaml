---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: lightwell-inward
---
# Needs to push into the demo-accounts namespace's image stream and read the
# cosign key. Scoped to the two namespaces the pipeline touches.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner
  namespace: lightwell-inward
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cosign-keypair", "acs-api-token"]
    verbs: ["get"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags", "imagestreamimages"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner
  namespace: lightwell-inward
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: lightwell-inward
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-image-builder
  namespace: demo-accounts
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: lightwell-inward
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
---
# Buildah needs an arbitrary uid AND the SETFCAP capability. anyuid grants
# the first and forbids the second, so the build pod was rejected outright:
#
#   pods "...-build-image-pod" is forbidden: unable to validate against any
#   security context constraint: [provider anyuid: .containers[0].
#   capabilities.add: Invalid value: "SETFCAP": capability may not be added
#
# pipelines-scc, which the OpenShift Pipelines operator installs, is anyuid
# plus exactly that one capability (runAsUser RunAsAny, allowedCapabilities
# [SETFCAP], allowPrivilegedContainer false). It is what the operator's own
# `pipeline` ServiceAccount uses to run buildah, and it is the narrowest
# thing that works.
#
# OpenShift auto-generates `system:openshift:scc:<name>` ClusterRoles only for
# the built-in SCCs, so pipelines-scc needs its own. Bound with a RoleBinding
# rather than a ClusterRoleBinding: the permission is only needed where the
# build runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipeline-runner-scc
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["pipelines-scc"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-scc
  namespace: lightwell-inward
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: lightwell-inward
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pipeline-runner-scc
