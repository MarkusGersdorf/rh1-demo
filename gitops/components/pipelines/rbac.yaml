---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: lightwell-inward
---
# Needs to push into the demo-accounts namespace's image stream and read the
# cosign key. Scoped to the two namespaces the pipeline touches.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner
  namespace: lightwell-inward
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cosign-keypair", "acs-api-token"]
    verbs: ["get"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags", "imagestreamimages"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner
  namespace: lightwell-inward
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: lightwell-inward
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-image-builder
  namespace: demo-accounts
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: lightwell-inward
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
---
# Buildah needs to write to /var/lib/containers; on OpenShift that means the
# anyuid SCC for this one ServiceAccount. Narrow and explicit beats
# cluster-wide relaxation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipeline-runner-anyuid
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: lightwell-inward
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
