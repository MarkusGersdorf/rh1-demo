---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-code-review
  namespace: lightwell-inward
  labels:
    app: ai-code-review
  annotations:
    # Redeploy when the ImageStream tag moves.
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"ai-code-review:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"scanner\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-code-review
  template:
    metadata:
      labels:
        app: ai-code-review
    spec:
      containers:
        - name: scanner
          # Replaced by the ImageStream trigger above on first build.
          image: ai-code-review:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ai-code-review-config
          env:
            - name: MODEL_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: ai-code-review-config
                  key: MODEL_DIGEST
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            # With a live backend this goes unready whenever the model is
            # unreachable, which is correct: the gate cannot do its job.
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: ai-code-review
  namespace: lightwell-inward
  labels:
    app: ai-code-review
spec:
  selector:
    app: ai-code-review
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-code-review
  namespace: lightwell-inward
  annotations:
    haproxy.router.openshift.io/timeout: 10m
spec:
  to:
    kind: Service
    name: ai-code-review
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
