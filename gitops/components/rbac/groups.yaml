---
# Created by hand in the console; brought under Argo CD so it is reconciled
# rather than remembered. Membership is declared here now - adding a user in
# the console is reverted by selfHeal, so edit this file instead.
#
# Note it grants nothing on its own. OpenShift's default `cluster-admins`
# ClusterRoleBinding binds Group/system:cluster-admins, not this group, and on
# this cluster the admin user's cluster-admin comes from its own
# keycloak-sso-user:admin:cluster-admin binding. If membership of this group
# should mean something, add the ClusterRoleBinding alongside it here.
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: cluster-admins
  annotations:
    # Opt this ONE resource out of the Application's ServerSideApply=true.
    # Argo CD cannot build a structured-merge diff for it and the whole
    # Application stops comparing:
    #
    #   Failed to compare desired state to live state: failed to calculate
    #   diff: error calculating structured merge diff: unable to resolve
    #   parseableType for GroupVersionKind: user.openshift.io/v1, Kind=Group
    #
    # Group is a pre-spec-convention type - `users` sits at the top level
    # rather than under .spec - so there is no parseable type for the
    # merge to work from. Client-side apply has no such requirement, and
    # the resource is three lines with no field-ownership to protect.
    #
    # This fails the whole Application, not just this file: with the diff
    # uncomputable, rbac reports Unknown and never reconciles.
    argocd.argoproj.io/sync-options: ServerSideApply=false
  labels:
    lightwell-inward.redhat.com/demo: "true"
users:
  - admin
