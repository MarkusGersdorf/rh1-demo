---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rbac
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/MarkusGersdorf/rh1-demo.git
    targetRevision: main
    path: gitops/components/rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The group already exists with the console as its field manager, so the
      # first sync is an adoption. Argo CD's server-side apply forces through
      # the conflict on users.
      - ServerSideApply=true
    retry:
      limit: 20
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 10m
