---
# App-of-apps. This is the single object that pulls in the whole cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lightwell-inward-root
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/MarkusGersdorf/rh1-demo.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
