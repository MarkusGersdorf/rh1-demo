name: Publish scanner image (manual)

# DELIBERATELY MANUAL. The demo does not need this.
#
# By default the scanner image is built inside the cluster by the BuildConfig
# in gitops/components/ai-code-review/build.yaml, and the demo app is built by
# the Tekton pipeline - which is the whole point of the walkthrough. Pushing
# images from GitHub would duplicate the first and undermine the second.
#
# Use this only when:
#   - the demo cluster has no egress to github.com, so the in-cluster build
#     cannot fetch the source; or
#   - you want a known-good image on hand as a fallback if the in-cluster
#     build misbehaves on the day.
#
# After publishing, point the deployment at the tag instead of the ImageStream:
#
#   oc set image deploy/ai-code-review -n lightwell-inward \
#     scanner=ghcr.io/<owner>/lightwell-inward-scanner:<tag>
#   oc annotate deploy/ai-code-review -n lightwell-inward \
#     image.openshift.io/triggers- --overwrite
#
# That second command matters: leave the ImageStream trigger in place and
# OpenShift will put the in-cluster image straight back.
#
# Note this never publishes the demo app image. An accounts-api image that did
# not come from the pipeline has no review attestation, so RHACS would refuse
# to admit it anyway - which is the demo working correctly.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true
        default: 'demo'

concurrency:
  group: publish-scanner
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests first
        # Never publish an image whose gate logic is broken.
        working-directory: components/ai-code-review
        run: |
          pip install -r requirements-dev.txt
          pytest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: components/ai-code-review
          file: components/ai-code-review/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lightwell-inward-scanner:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/lightwell-inward-scanner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MSG'
          ### Published

          ```
          ghcr.io/${{ github.repository_owner }}/lightwell-inward-scanner:${{ inputs.tag }}
          ```

          The package is private by default. Make it public, or add a pull
          secret to the `lightwell-inward` namespace, before the cluster can
          pull it.
          MSG
